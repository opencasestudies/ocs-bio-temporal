<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Labeled RStudio Server window for this case study</title>
  <desc id="desc">A simplified RStudio Server window showing where learners paste R code, run code, read console output, use the terminal for Python and full scripts, and find saved output files.</desc>
  <defs>
    <style>
      .bg { fill: #f5f7fb; }
      .window { fill: #ffffff; stroke: #1f2937; stroke-width: 3; }
      .bar { fill: #243b53; }
      .tabbar { fill: #e8eef6; }
      .pane { fill: #ffffff; stroke: #8aa0b8; stroke-width: 2; }
      .pane-head { fill: #d9e7f5; stroke: #8aa0b8; stroke-width: 2; }
      .terminal-head { fill: #e7f1e8; stroke: #8aa0b8; stroke-width: 2; }
      .files-head { fill: #f4ead7; stroke: #8aa0b8; stroke-width: 2; }
      .label { font: 700 24px Arial, sans-serif; fill: #102a43; }
      .small { font: 18px Arial, sans-serif; fill: #334e68; }
      .code { font: 18px Menlo, Consolas, monospace; fill: #083344; }
      .button { fill: #2f855a; stroke: #1f5f3d; stroke-width: 2; }
      .button-text { font: 700 17px Arial, sans-serif; fill: #ffffff; }
      .callout { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; }
      .callout-blue { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .callout-green { fill: #ecfdf5; stroke: #047857; stroke-width: 2; }
      .callout-purple { fill: #f5f3ff; stroke: #6d28d9; stroke-width: 2; }
      .callout-text { font: 700 20px Arial, sans-serif; fill: #102a43; }
      .callout-small { font: 17px Arial, sans-serif; fill: #334e68; }
      .arrow { stroke: #c2410c; stroke-width: 4; fill: none; marker-end: url(#arrowhead); }
      .arrow-blue { stroke: #2563eb; stroke-width: 4; fill: none; marker-end: url(#arrowhead-blue); }
      .arrow-green { stroke: #047857; stroke-width: 4; fill: none; marker-end: url(#arrowhead-green); }
      .arrow-purple { stroke: #6d28d9; stroke-width: 4; fill: none; marker-end: url(#arrowhead-purple); }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#c2410c"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#047857"/>
    </marker>
    <marker id="arrowhead-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="760"/>
  <text class="label" x="60" y="48">Using RStudio Server for this case study</text>
  <text class="small" x="60" y="78">Open the case-study page in one browser tab and RStudio Server in another.</text>

  <rect class="window" x="60" y="110" width="880" height="590" rx="10"/>
  <rect class="bar" x="60" y="110" width="880" height="48" rx="10"/>
  <text x="84" y="141" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">RStudio Server</text>
  <text x="756" y="141" font-family="Arial, sans-serif" font-size="17" fill="#dbeafe">/home/rstudio/project</text>

  <rect class="pane" x="80" y="178" width="545" height="275"/>
  <rect class="pane-head" x="80" y="178" width="545" height="42"/>
  <text class="label" x="102" y="207">Source pane</text>
  <rect class="button" x="535" y="185" width="72" height="28" rx="5"/>
  <text class="button-text" x="554" y="205">Run</text>
  <text class="code" x="104" y="252"># Paste short R chunks here</text>
  <text class="code" x="104" y="286">library(readr)</text>
  <text class="code" x="104" y="320">rq1 &lt;- read_csv("data/.../RQ1.csv")</text>
  <text class="code" x="104" y="354">rq1 |&gt; head()</text>
  <line x1="100" y1="382" x2="590" y2="382" stroke="#d9e2ec" stroke-width="2"/>
  <text class="small" x="104" y="416">Highlight code and click Run, or press Command/Ctrl + Enter.</text>

  <rect class="pane" x="80" y="475" width="545" height="205"/>
  <rect class="terminal-head" x="80" y="475" width="545" height="42"/>
  <text class="label" x="102" y="504">Console and Terminal pane</text>
  <text class="code" x="104" y="542">&gt; getwd()</text>
  <text class="code" x="104" y="575">"/home/rstudio/project"</text>
  <text class="code" x="104" y="610">$ /opt/cogaps-venv/bin/python script.py</text>
  <text class="small" x="104" y="650">Read printed tables, messages, errors, and full-script progress here.</text>

  <rect class="pane" x="650" y="178" width="290" height="502"/>
  <rect class="files-head" x="650" y="178" width="290" height="42"/>
  <text class="label" x="672" y="207">Files / Plots pane</text>
  <text class="small" x="672" y="252">Files</text>
  <line x1="672" y1="263" x2="916" y2="263" stroke="#d9e2ec" stroke-width="2"/>
  <text class="code" x="672" y="296">data/</text>
  <text class="code" x="692" y="328">processed/</text>
  <text class="code" x="692" y="360">external/</text>
  <text class="code" x="672" y="404">scripts/</text>
  <text class="code" x="692" y="436">reproduction/</text>
  <rect x="678" y="485" width="210" height="120" fill="#eef2ff" stroke="#94a3b8"/>
  <polyline points="690,572 725,530 760,550 805,505 862,536" fill="none" stroke="#2563eb" stroke-width="4"/>
  <text class="small" x="672" y="642">Saved figures and tables appear here.</text>

  <rect class="callout-blue" x="965" y="156" width="170" height="82" rx="8"/>
  <text class="callout-text" x="982" y="184">Paste R chunks</text>
  <text class="callout-small" x="982" y="211">in Source pane</text>
  <path class="arrow-blue" d="M 964 214 C 845 240, 744 248, 613 250"/>

  <rect class="callout" x="965" y="292" width="170" height="100" rx="8"/>
  <text class="callout-text" x="982" y="321">Run selected</text>
  <text class="callout-text" x="982" y="346">lines</text>
  <text class="callout-small" x="982" y="373">or use Console</text>
  <path class="arrow" d="M 965 332 C 870 300, 760 230, 604 199"/>

  <rect class="callout-green" x="965" y="441" width="170" height="96" rx="8"/>
  <text class="callout-text" x="982" y="470">Use Terminal</text>
  <text class="callout-small" x="982" y="497">for Python and</text>
  <text class="callout-small" x="982" y="520">full scripts</text>
  <path class="arrow-green" d="M 965 497 C 820 528, 705 555, 610 610"/>

  <rect class="callout-purple" x="965" y="585" width="170" height="94" rx="8"/>
  <text class="callout-text" x="982" y="615">Find outputs</text>
  <text class="callout-small" x="982" y="642">in Files/Plots</text>
  <path class="arrow-purple" d="M 965 628 C 925 625, 900 608, 862 560"/>
</svg>
